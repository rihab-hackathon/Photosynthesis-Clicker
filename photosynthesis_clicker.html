<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Photosynthesis Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0a1628 0%,#0d2b1a 60%,#071a0d 100%);min-height:100vh;font-family:'Quicksand',sans-serif;color:#d4f5d4;padding:1rem}
h1{font-family:'Baloo 2',cursive;font-size:2rem;text-align:center;color:#7eff8b;text-shadow:0 0 20px #00ff4466;margin-bottom:.2rem}
.sub{text-align:center;font-size:.75rem;color:#4a8a54;margin-bottom:1.2rem;letter-spacing:.08em}
.layout{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 240px;gap:1rem}

/* Energy bar */
.energy-box{background:#0d1f0e;border:1px solid #1e4a22;border-radius:14px;padding:.8rem 1.4rem;text-align:center;margin-bottom:.8rem}
.energy-num{font-family:'Baloo 2',cursive;font-size:2.6rem;color:#7eff8b;line-height:1;text-shadow:0 0 12px #00ff4455}
.energy-meta{font-size:.7rem;color:#4a8a54;margin-top:.2rem}

/* Scene */
.scene{position:relative;width:100%;height:240px;background:linear-gradient(180deg,#020d04 0%,#071a0d 70%,#0a2a10 100%);border:1px solid #1e4a22;border-radius:14px;overflow:hidden;margin-bottom:.8rem;cursor:crosshair}
.scene:active{filter:brightness(1.15)}
.moon{position:absolute;top:12px;right:16px;width:44px;height:44px;background:radial-gradient(circle at 35% 35%,#ffffcc,#e6e000);border-radius:50%;box-shadow:0 0 18px #ffff0055;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px #ffff0055}50%{box-shadow:0 0 32px #ffff0099}}
.stars{position:absolute;top:0;left:0;right:0;height:100px;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.ground{position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(180deg,#1a3a0a,#0d2005);border-top:2px solid #2d5a14}
.plant{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.stem{width:8px;background:linear-gradient(90deg,#1a6b22,#3dba4e);border-radius:4px;transition:height .5s ease;min-height:10px}
.leaf{position:absolute;border-radius:50% 0 50% 0;opacity:0;transition:all .5s}
.leaf.l{right:8px;bottom:8px;transform:rotate(35deg);background:linear-gradient(135deg,#3dba4e,#1a6b22)}
.leaf.r{left:8px;bottom:20px;transform:rotate(-35deg) scaleX(-1);background:linear-gradient(135deg,#52d466,#256b2e)}
.flower{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:1.8rem;opacity:0;transition:opacity .5s;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(4deg)}}
.particle{position:absolute;pointer-events:none;font-size:1rem;animation:pop .9s ease-out forwards}
@keyframes pop{to{opacity:0;transform:translateY(-55px) scale(.5)}}
.click-hint{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-size:.6rem;color:#2a5a30;letter-spacing:.1em;animation:hint 2s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.4}50%{opacity:.9}}

/* Button */
.btn{display:block;width:100%;background:linear-gradient(135deg,#1e6b28,#3dba4e);border:none;border-radius:12px;padding:.75rem;font-family:'Baloo 2',cursive;font-size:1.1rem;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0d3a14,0 6px 14px #00ff4422;transition:transform .08s,box-shadow .08s;margin-bottom:.8rem;letter-spacing:.03em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d3a14}

/* Stage */
.stage-txt{text-align:center;font-size:.7rem;color:#4a8a54;letter-spacing:.06em}
.stage-txt b{color:#7eff8b}

/* Sidebar */
.sidebar{display:flex;flex-direction:column;gap:.8rem}
.panel{background:#0d1f0e;border:1px solid #1e4a22;border-radius:12px;padding:.8rem}
.panel-title{font-family:'Baloo 2',cursive;font-size:.9rem;color:#7eff8b;margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px dashed #1e4a22}

/* Upgrades */
.upg{width:100%;background:#071408;border:1px solid #1e4a22;border-radius:8px;padding:.5rem .6rem;margin-bottom:.35rem;cursor:pointer;text-align:left;font-family:'Quicksand',sans-serif;transition:all .2s}
.upg:last-child{margin-bottom:0}
.upg.ready{border-color:#3dba4e;background:#0d2a10}
.upg.ready:hover{background:#1a4a20}
.upg.done{opacity:.45;cursor:default}
.upg.locked{opacity:.35;cursor:not-allowed}
.upg-name{font-size:.8rem;font-weight:700;color:#a8f5b0}
.upg-desc{font-size:.62rem;color:#4a8a54;margin-top:.1rem}
.upg-cost{font-size:.62rem;color:#ffcc44;margin-top:.15rem;font-weight:700}
.upg.done .upg-cost{color:#3dba4e}

/* Stages list */
.srow{display:flex;align-items:center;gap:.5rem;padding:.25rem .3rem;border-radius:6px;font-size:.68rem;margin-bottom:.15rem}
.srow.now{background:#0d2a10;color:#7eff8b;font-weight:700}
.srow.done{color:#2d6a34}
.srow.next{color:#1e3a22}

/* Toast */
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(70px);background:#0d2a10;border:1px solid #3dba4e;color:#7eff8b;padding:.5rem 1.2rem;border-radius:50px;font-family:'Baloo 2',cursive;font-size:.85rem;z-index:999;transition:transform .3s;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:580px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>

<h1>🌱 Photosynthesis Clicker</h1>
<p class="sub">click the plant · absorb moonlight · grow to full bloom</p>
<div class="toast" id="toast"></div>

<div class="layout">
<div>
<div class="energy-box">
<div class="energy-num" id="eNum">0</div>
<div class="energy-meta">☀️ Light Energy &nbsp;·&nbsp; <span id="aps">+0/sec</span></div>
</div>

<div class="scene" id="scene" onclick="clickScene(event)">
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="ground"></div>
<div class="plant" id="plant">
<div style="position:relative">
<div class="leaf l" id="lL"></div>
<div class="leaf r" id="lR"></div>
<div class="flower" id="flower">🌸</div>
</div>
<div class="stem" id="stem"></div>
</div>
<div class="click-hint" id="hint">CLICK TO ABSORB</div>
</div>

<button class="btn" onclick="clickScene({clientX:window.innerWidth/2,clientY:300})">☀️ Absorb Light</button>
<div class="stage-txt">Stage: <b id="sName">Seed</b></div>
</div>

<div class="sidebar">
<div class="panel">
<div class="panel-title">🧬 Upgrades</div>
<div id="upgList"></div>
</div>
<div class="panel">
<div class="panel-title">🌳 Stages</div>
<div id="sList"></div>
</div>
<div class="panel">
<div class="panel-title">📖 Did You Know?</div>
<div id="fact" style="font-size:.68rem;color:#4a8a54;line-height:1.6">Click to start photosynthesis!</div>
</div>
</div>
</div>

<script>
let E=0,total=0,perClick=1,perSec=0,stage=0;

const UPG=[
{id:'chl',i:'🟢',n:'Chlorophyll',d:'+2 energy/click',c:15,f:'Chlorophyll absorbs blue & red light for photosynthesis.',fn:()=>{perClick+=2}},
{id:'roo',i:'🌿',n:'Deep Roots',d:'+1 energy/sec',c:30,f:'Roots absorb water needed to split into H₂ and O.',fn:()=>{perSec+=1}},
{id:'sto',i:'💧',n:'Stomata',d:'+2 energy/sec',c:90,f:'Stomata let CO₂ in and O₂ out of leaves.',fn:()=>{perSec+=2}},
{id:'big',i:'🍃',n:'Big Leaves',d:'×2 click power',c:250,f:'More leaf area = more sunlight absorbed.',fn:()=>{perClick*=2}},
{id:'clo',i:'⚡',n:'Chloroplasts',d:'+5 energy/sec',c:600,f:'Chloroplasts are where the magic happens.',fn:()=>{perSec+=5}},
{id:'glu',i:'🍬',n:'Glucose Store',d:'×2 auto energy',c:1500,f:'Plants store energy as glucose for growth.',fn:()=>{perSec*=2}},
{id:'flo',i:'🌸',n:'Flowering',d:'×3 everything',c:5000,f:'Flowers attract pollinators for reproduction.',fn:()=>{perClick*=3;perSec*=3}},
];
UPG.forEach(u=>u.bought=false);

const STAGES=[
{n:'Seed',i:'🌰',r:0},{n:'Sprout',i:'🌱',r:20},{n:'Seedling',i:'🪴',r:100},
{n:'Young Plant',i:'🌿',r:400},{n:'Bush',i:'🌳',r:1500},{n:'Full Bloom',i:'🌸',r:6000}
];

// Stars
const stars=document.getElementById('stars');
for(let i=0;i<25;i++){
const s=document.createElement('div');
s.className='star';
s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*80}px;animation-delay:${Math.random()*2}s`;
stars.appendChild(s);
}

function fmt(n){n=Math.floor(n);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n}

function clickScene(e){
E+=perClick; total+=perClick;
const sc=document.getElementById('scene');
const r=sc.getBoundingClientRect();
const p=document.createElement('div');
p.className='particle';
p.textContent=['✨','🌟','⚡','💚'][Math.floor(Math.random()*4)];
p.style.left=(e.clientX-r.left-8)+'px';
p.style.top=(e.clientY-r.top-8)+'px';
sc.appendChild(p);
setTimeout(()=>p.remove(),900);
render();
}

function buy(id){
const u=UPG.find(x=>x.id===id);
if(!u||u.bought||E<u.c)return;
E-=u.c; u.bought=true; u.fn();
toast(u.i+' '+u.n+' unlocked!');
document.getElementById('fact').textContent=u.f;
render();
}

function toast(m){
const t=document.getElementById('toast');
t.textContent=m; t.classList.add('on');
setTimeout(()=>t.classList.remove('on'),2500);
}

function updatePlant(){
const pct=stage/(STAGES.length-1);
document.getElementById('stem').style.height=(12+pct*130)+'px';
const ls=Math.max(0,(stage-1)*18);
['lL','lR'].forEach(id=>{
const l=document.getElementById(id);
l.style.width=l.style.height=ls+'px';
l.style.opacity=stage>=2?'1':'0';
});
document.getElementById('flower').style.opacity=stage>=5?'1':'0';
document.getElementById('hint').style.opacity=stage>=1?'0':'1';
}

function render(){
// Stage up?
let ns=0;
for(let i=STAGES.length-1;i>=0;i--){if(total>=STAGES[i].r){ns=i;break}}
if(ns>stage){stage=ns;toast('🌱 Grew into: '+STAGES[stage].n+'!');updatePlant()}

document.getElementById('eNum').textContent=fmt(E);
document.getElementById('aps').textContent='+'+fmt(perSec)+'/sec';
document.getElementById('sName').textContent=STAGES[stage].n;

document.getElementById('upgList').innerHTML=UPG.map(u=>{
const cls=u.bought?'done':E>=u.c?'ready':'locked';
const dis=u.bought||E<u.c?'disabled':'';
return`<button class="upg ${cls}" onclick="buy('${u.id}')" ${dis}>
<div class="upg-name">${u.i} ${u.n}</div>
<div class="upg-desc">${u.d}</div>
<div class="upg-cost">${u.bought?'✓ Owned':fmt(u.c)+' energy'}</div>
</button>`;
}).join('');

document.getElementById('sList').innerHTML=STAGES.map((s,i)=>`
<div class="srow ${i===stage?'now':i<stage?'done':'next'}">
<span>${s.i}</span><span style="flex:1">${s.n}</span>
<span style="font-size:.6rem">${i<=stage?'✓':fmt(s.r)}</span>
</div>`).join('');
}

setInterval(()=>{if(perSec>0){E+=perSec;total+=perSec;render()}},1000);
updatePlant();
render();
</script>
</body>
</html>
